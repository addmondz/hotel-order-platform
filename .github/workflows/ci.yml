name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing-only
          MYSQL_DATABASE: orderdesk_test
          MYSQL_USER: orderdesk
          MYSQL_PASSWORD: testing-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, dom, gd, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --prefer-dist --no-interaction --working-dir=backend
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate --no-interaction
        working-directory: backend
      - run: php artisan test
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: orderdesk_test
          DB_USERNAME: orderdesk
          DB_PASSWORD: testing-only

  deploy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t orderdesk:test .
      - name: Smoke test the deploy image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php orderdesk:test -m | grep -xi pdo_mysql
          key="base64:$(openssl rand -base64 32)"
          docker run -d --name orderdesk-ci -e "APP_KEY=$key" -e PORT=8091 -e SESSION_DRIVER=array -e CACHE_STORE=array -p 127.0.0.1:18080:8091 orderdesk:test
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/up >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/up >/dev/null
          for page in / /admin /customer; do
            curl --fail --silent --show-error "http://127.0.0.1:18080$page" | grep -Fq 'id="app"'
          done
          asset=$(curl --fail --silent http://127.0.0.1:18080/ | grep -oE '/dist/assets/[^"]+\.js' | head -n 1)
          curl --fail --silent --show-error "http://127.0.0.1:18080$asset" >/dev/null
      - name: Show startup logs
        if: failure()
        run: docker logs orderdesk-ci || true
      - name: Remove smoke test container
        if: always()
        run: docker rm -f orderdesk-ci || true
